<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบข้อมูลนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- pdf make -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.12/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.12/vfs_fonts.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Sarabun", sans-serif;
        background-color: #f3f4f6;
      }
    </style>
  </head>
  <body class="text-gray-800 h-screen flex flex-col">
    <div class="flex justify-center items-center mt-10">
      <div class="grid grid-cols-1 gap-4 w-full max-w-2xl px-4">
        <!-- Form Section -->
        <div>
          <form
            id="add-student-form"
            class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8"
          >
            <h2 class="text-xl font-bold mb-4 text-indigo-700">
              เพิ่มข้อมูลนักเรียน
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <!-- Student ID -->
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >รหัสนักเรียน <span class="text-red-500">*</span></label
                >
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400"
                    ><i class="fa-solid fa-id-card"></i
                  ></span>
                  <input
                    type="text"
                    name="studentId"
                    required
                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="เช่น 65001"
                  />
                </div>
              </div>

              <!-- Full Name -->
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >ชื่อ-นามสกุล <span class="text-red-500">*</span></label
                >
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400"
                    ><i class="fa-solid fa-user"></i
                  ></span>
                  <input
                    type="text"
                    name="fullName"
                    required
                    class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="เช่น เด็กชาย รักเรียน"
                  />
                </div>
              </div>

              <!-- Grade & Room -->
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >ระดับชั้น</label
                >
                <select
                  name="grade"
                  class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                >
                  <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
                  <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
                </select>
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >ห้อง</label
                >
                <input
                  type="text"
                  name="room"
                  class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none"
                  placeholder="เช่น 1"
                />
              </div>

              <!-- Note -->
              <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >หมายเหตุเพิ่มเติม</label
                >
                <textarea
                  name="note"
                  rows="3"
                  class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none resize-none"
                  placeholder="ข้อมูลสุขภาพ, ผู้ปกครอง..."
                ></textarea>
              </div>
            </div>

            <!-- Student Status -->
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-3">
                สถานะนักเรียน
              </label>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Active -->
                <label
                  class="cursor-pointer border-2 rounded-xl p-4 flex items-center gap-3 transition-all has-[:checked]:border-green-500 has-[:checked]:bg-green-50"
                >
                  <input
                    type="radio"
                    name="status"
                    value="active"
                    class="hidden"
                    checked
                  />
                  <i
                    class="fa-solid fa-circle-check text-green-500 text-xl"
                  ></i>
                  <div>
                    <p class="font-semibold text-gray-800">กำลังเรียน</p>
                    <p class="text-xs text-gray-500">สถานะปกติ</p>
                  </div>
                </label>

                <!-- Suspended -->
                <label
                  class="cursor-pointer border-2 rounded-xl p-4 flex items-center gap-3 transition-all has-[:checked]:border-yellow-500 has-[:checked]:bg-yellow-50"
                >
                  <input
                    type="radio"
                    name="status"
                    value="suspended"
                    class="hidden"
                  />
                  <i
                    class="fa-solid fa-pause-circle text-yellow-500 text-xl"
                  ></i>
                  <div>
                    <p class="font-semibold text-gray-800">พักการเรียน</p>
                    <p class="text-xs text-gray-500">ชั่วคราว</p>
                  </div>
                </label>

                <!-- Graduated -->
                <label
                  class="cursor-pointer border-2 rounded-xl p-4 flex items-center gap-3 transition-all has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50"
                >
                  <input
                    type="radio"
                    name="status"
                    value="graduated"
                    class="hidden"
                  />
                  <i
                    class="fa-solid fa-graduation-cap text-blue-500 text-xl"
                  ></i>
                  <div>
                    <p class="font-semibold text-gray-800">จบการศึกษา</p>
                    <p class="text-xs text-gray-500">สำเร็จการเรียน</p>
                  </div>
                </label>
              </div>
            </div>

            <div class="mt-6 flex justify-center gap-4">
              <!-- ปุ่มนี้จะเรียกฟังก์ชัน createStudent() -->
              <button
                id="btn-show"
                class="px-6 py-3 bg-slate-500 hover:bg-slate-600 text-white rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center gap-2 font-bold"
              >
                Create Student
              </button>
            </div>
          </form>
        </div>

        <button id="btn-pdf">pdf</button>
      </div>
      <!-- ส่วนแสดงรายการ -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
        <h3 class="font-bold text-gray-700 mb-2">
          รายการข้อมูลในระบบ (<span id="count-student">0</span> คน)
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left text-gray-500">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50">
              <tr>
                <th class="px-4 py-3">รหัส</th>
                <th class="px-4 py-3">ชื่อ-สกุล</th>
                <th class="px-4 py-3">ชั้น</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr>
                <td colspan="3" class="px-4 py-3 text-center text-gray-400">
                  กำลังเชื่อมต่อฐานข้อมูล...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
